name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:e2e
      - name: Review the deployed layout
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/check-production-layout.mjs
      - name: Save layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-review-${{ github.sha }}
          path: test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7
